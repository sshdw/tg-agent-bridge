<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Bridge</title>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./app.css">
<script>
try {
  var storedPerf = null;
  try { storedPerf = localStorage.getItem('perf_choice'); } catch (e) {}
  document.documentElement.dataset.perf = (storedPerf === 'lite' || storedPerf === 'full') ? storedPerf : 'full';
} catch (e) {}
</script>
<script type="module" src="./app.js"></script>
</head>
<body class="app-bg">
<div class="app" id="app">
<header class="app-head">
<h1 class="h-title" id="app-title">Agent Bridge</h1>
</header>
<main id="screen" class="screen" role="main" aria-live="polite"></main>
<div id="float-slot"></div>
<nav class="glass-nav bottom-nav" aria-label="Primary">
<span class="glass-tex" aria-hidden="true"></span>
<span class="nav-indicator" id="nav-ind" aria-hidden="true"></span>
<button class="nav-item" type="button" data-tab="home" aria-selected="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/></svg>
<span>Home</span>
</button>
<button class="nav-item" type="button" data-tab="tasks" aria-selected="false">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14"/><path d="M5 12h14"/><path d="M5 18h14"/></svg>

<span>More</span>
</button>
</nav>
</div>
